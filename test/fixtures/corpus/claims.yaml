# Career corpus — atomic evidence claims (TEST FIXTURE — an invented persona)
#
# THE CONTRACT: every `claim` and every `variants` entry states something
# traceable to `source`, which quotes the original CV. Variants may re-emphasise,
# re-order or re-word. Variants may NOT add a fact, a number, a technology or a
# scope that `source` does not support. The anti-fabrication gate
# (src/position/antifab.ts) enforces this mechanically before any submission.
#
# `strength` 1-5 = how differentiating this claim is in a competitive pool.
# `domains` drive selection when a positioning target is requested at runtime.
# `domains[0]` is what the claim is most about.

claims:

  # ──────────────────────────── Identity and access ────────────────────────────
  - id: claim-idp-consolidation
    employer: lumengrove
    claim: >
      Consolidated three separate directories into a single Microsoft Entra ID
      tenant covering 900+ accounts, with one joiner-mover-leaver process for the
      whole company.
    variants:
      iam: >
        Owns the identity directory for 900+ accounts in Microsoft Entra ID,
        created by merging three legacy directories into one tenant with a single
        lifecycle process.
      security: >
        Removed three parallel directories as an attack surface, bringing 900+
        accounts under one Microsoft Entra ID tenant and one lifecycle process.
    domains: [iam, identity, security, cloud]
    skills: ["Microsoft Entra ID", "IAM / RBAC", Python]
    metric: 900+ accounts
    scope: company-wide identity directory
    strength: 5
    source: >
      "Merged three directories into a single Microsoft Entra ID tenant (900+
      accounts) and defined the joiner-mover-leaver process used company-wide."

